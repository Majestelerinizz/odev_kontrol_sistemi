name: odev_takip
description: "Öğretmenlerin öğrenci çalışmalarını merkezi olarak yönetmesini ve velilerin çocuklarının gelişimini takip etmesini sağlayan eğitim takip platformu."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.0.4
  cloud_functions: ^5.1.3
  app_links: ^6.3.2

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Charts
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # File Handling
  file_picker: ^8.1.2
  image_picker: ^1.1.2

  # Utils
  intl: ^0.20.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  logger: ^2.4.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  http: ^1.2.2                  # PostgreSQL sync backend ile iletişim için

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/eduly_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  # Nunito fontu google_fonts paketi üzerinden runtime'da yükleniyor.
  # Yerel TTF dosyaları gerekmez.
