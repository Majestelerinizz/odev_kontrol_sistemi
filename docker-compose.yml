services:
  # ─── PostgreSQL Veritabanı ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: odevtakip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odevuser
      POSTGRES_PASSWORD: odevpass123
      POSTGRES_DB: odevtakip
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odevuser -d odevtakip']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── pgAdmin (Görsel DB Yönetimi) ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odevtakip_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@odevtakip.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
